[project]
name = "easyread"
version = "0.1.0"
description = "EasyRead: Extract and transcribe mixed study sources (PowerPoint, PDF, Word, audio) for LLM prompt generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.23.0",
    "openai-whisper>=20231117",
    "torch>=2.1.0",
]

[project.optional-dependencies]
gui = [
    "tkinterdnd2>=0.3.0",
    "ttkbootstrap>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/amirrezesf/EasyRead"
Repository = "https://github.com/amirrezesf/EasyRead"

[project.scripts]
easyread = "easyread.cli:cli_main"
easyread-gui = "easyread.gui:gui_main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["easyread*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]